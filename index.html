<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeJournal - Clean Online Trading Journal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        borderCol: '#334155',
                        neonGreen: '#10b981',
                        neonRed: '#ef4444',
                        accentBlue: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col antialiased selection:bg-accentBlue selection:text-white">

    <!-- Header -->
    <header class="bg-cardBg border-b border-borderCol sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-accentBlue/20 text-accentBlue p-2.5 rounded-xl border border-accentBlue/30">
                    <i class="fa-solid fa-chart-line text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white tracking-wide">TradeJournal</h1>
                    <p class="text-xs text-gray-400">Simple & Clean Stock/Crypto Journal</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="exportCSV()" class="px-3.5 py-2 bg-borderCol/60 hover:bg-borderCol text-gray-300 rounded-xl text-xs font-medium transition-all flex items-center space-x-2" title="Export CSV">
                    <i class="fa-solid fa-file-csv text-neonGreen"></i>
                    <span class="hidden sm:inline">Export CSV</span>
                </button>
                <button onclick="clearAllData()" class="px-3.5 py-2 bg-red-500/10 hover:bg-red-500/20 text-neonRed rounded-xl text-xs font-medium transition-all flex items-center space-x-2" title="Reset Data">
                    <i class="fa-solid fa-trash-can"></i>
                    <span class="hidden sm:inline">Reset All</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Summary Metrics Dashboard -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <!-- Total P&L -->
            <div class="bg-cardBg border border-borderCol p-5 rounded-2xl flex flex-col justify-between">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total P&L</span>
                <div id="metric-pnl" class="text-2xl font-bold tracking-tight text-white mt-2">$0.00</div>
            </div>
            <!-- Win Rate -->
            <div class="bg-cardBg border border-borderCol p-5 rounded-2xl flex flex-col justify-between">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Win Rate</span>
                <div id="metric-winrate" class="text-2xl font-bold tracking-tight text-white mt-2">0.0%</div>
            </div>
            <!-- Total Trades -->
            <div class="bg-cardBg border border-borderCol p-5 rounded-2xl flex flex-col justify-between">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Trades</span>
                <div id="metric-total" class="text-2xl font-bold tracking-tight text-white mt-2">0</div>
            </div>
            <!-- Profit Factor -->
            <div class="bg-cardBg border border-borderCol p-5 rounded-2xl flex flex-col justify-between">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Profit Factor</span>
                <div id="metric-pf" class="text-2xl font-bold tracking-tight text-white mt-2">0.00</div>
            </div>
        </div>

        <!-- Form Section -->
        <div class="bg-cardBg border border-borderCol p-6 rounded-2xl shadow-lg">
            <h2 class="text-base font-bold text-white mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-circle-plus text-accentBlue"></i>
                <span>Add New Trade</span>
            </h2>
            <form id="tradeForm" onsubmit="addTrade(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 items-end">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Date</label>
                    <input type="date" id="tradeDate" required class="w-full px-3 py-2 bg-darkBg border border-borderCol rounded-xl text-sm text-white focus:outline-none focus:border-accentBlue">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Symbol</label>
                    <input type="text" id="tradeSymbol" placeholder="e.g. AAPL, BTC" required class="w-full px-3 py-2 bg-darkBg border border-borderCol rounded-xl text-sm text-white uppercase focus:outline-none focus:border-accentBlue">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Type</label>
                    <select id="tradeType" class="w-full px-3 py-2 bg-darkBg border border-borderCol rounded-xl text-sm text-white focus:outline-none focus:border-accentBlue">
                        <option value="Long">Long</option>
                        <option value="Short">Short</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Strategy</label>
                    <input type="text" id="tradeStrategy" placeholder="e.g. Breakout, Swing" required class="w-full px-3 py-2 bg-darkBg border border-borderCol rounded-xl text-sm text-white focus:outline-none focus:border-accentBlue">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">P&L ($)</label>
                    <input type="number" step="any" id="tradePnl" placeholder="e.g. 150.50 or -45" required class="w-full px-3 py-2 bg-darkBg border border-borderCol rounded-xl text-sm text-white focus:outline-none focus:border-accentBlue">
                </div>
                <div class="sm:col-span-2 lg:col-span-4">
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Notes / Mistakes</label>
                    <input type="text" id="tradeNotes" placeholder="Optional notes about setup, entry, or emotion..." class="w-full px-3 py-2 bg-darkBg border border-borderCol rounded-xl text-sm text-white focus:outline-none focus:border-accentBlue">
                </div>
                <div>
                    <button type="submit" class="w-full py-2 bg-accentBlue hover:bg-accentBlue/90 text-white rounded-xl text-sm font-medium shadow-md shadow-accentBlue/25 transition-all">
                        <i class="fa-solid fa-plus mr-1"></i> Add Trade
                    </button>
                </div>
            </form>
        </div>

        <!-- Trades Table Section -->
        <div class="bg-cardBg border border-borderCol rounded-2xl shadow-lg overflow-hidden">
            <div class="p-4 sm:p-6 border-b border-borderCol flex justify-between items-center">
                <h2 class="text-base font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-list text-accentBlue"></i>
                    <span>Logged Trades</span>
                </h2>
                <span id="tradeCountBadge" class="text-xs px-2.5 py-1 bg-darkBg border border-borderCol rounded-full text-gray-400 font-medium">0 Trades</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-borderCol text-xs text-gray-400 uppercase bg-darkBg/50">
                            <th class="py-3 px-4">Date</th>
                            <th class="py-3 px-4">Symbol</th>
                            <th class="py-3 px-4">Type</th>
                            <th class="py-3 px-4">Strategy</th>
                            <th class="py-3 px-4">Notes</th>
                            <th class="py-3 px-4 text-right">P&L ($)</th>
                            <th class="py-3 px-4 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tradesTableBody" class="text-sm divide-y divide-borderCol/50">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- JavaScript Application Logic -->
    <script>
        // Initialize blank or loaded from localStorage
        let trades = JSON.parse(localStorage.getItem('tradejournal_entries')) || [];

        window.onload = function() {
            // Set today's date as default in form
            document.getElementById('tradeDate').valueAsDate = new Date();
            renderApp();
        };

        function addTrade(e) {
            e.preventDefault();
            const date = document.getElementById('tradeDate').value;
            const symbol = document.getElementById('tradeSymbol').value.toUpperCase().trim();
            const type = document.getElementById('tradeType').value;
            const strategy = document.getElementById('tradeStrategy').value.trim();
            const pnl = parseFloat(document.getElementById('tradePnl').value);
            const notes = document.getElementById('tradeNotes').value.trim();

            const newTrade = {
                id: 't-' + Date.now(),
                date,
                symbol,
                type,
                strategy,
                pnl,
                notes
            };

            trades.unshift(newTrade); // Add to beginning of array
            saveAndRefresh();
            
            // Reset form fields except date
            document.getElementById('tradeSymbol').value = '';
            document.getElementById('tradeStrategy').value = '';
            document.getElementById('tradePnl').value = '';
            document.getElementById('tradeNotes').value = '';
            document.getElementById('tradeSymbol').focus();
        }

        function deleteTrade(id) {
            if(confirm('Are you sure you want to delete this trade?')) {
                trades = trades.filter(t => t.id !== id);
                saveAndRefresh();
            }
        }

        function clearAllData() {
            if(trades.length === 0) return;
            if(confirm('Are you sure you want to reset and delete all saved trades?')) {
                trades = [];
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('tradejournal_entries', JSON.stringify(trades));
            renderApp();
        }

        function renderApp() {
            renderTable();
            renderMetrics();
        }

        function renderTable() {
            const tbody = document.getElementById('tradesTableBody');
            tbody.innerHTML = '';

            document.getElementById('tradeCountBadge.textContent` // Wait clean template
            document.getElementById('tradeCountBadge').textContent = `${trades.length} Trade${trades.length === 1 ? '' : 's'}`;

            if(trades.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-gray-500 text-sm">No trades logged yet. Fill out the form above to add your first trade.</td></tr>`;
                return;
            }

            trades.forEach(t => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-borderCol/30 transition-all";
                tr.innerHTML = `
                    <td class="py-3 px-4 text-xs text-gray-400 whitespace-nowrap">${t.date}</td>
                    <td class="py-3 px-4 font-bold text-white whitespace-nowrap">${t.symbol}</td>
                    <td class="py-3 px-4 whitespace-nowrap"><span class="px-2 py-0.5 rounded text-xs font-semibold ${t.type === 'Long' ? 'bg-accentBlue/20 text-accentBlue' : 'bg-purple-500/20 text-purple-400'}">${t.type}</span></td>
                    <td class="py-3 px-4 text-gray-300 text-xs whitespace-nowrap">${t.strategy}</td>
                    <td class="py-3 px-4 text-gray-400 text-xs max-w-xs truncate">${t.notes || '-'}</td>
                    <td class="py-3 px-4 text-right font-bold whitespace-nowrap ${t.pnl >= 0 ? 'text-neonGreen' : 'text-neonRed'}">${t.pnl >= 0 ? '+' : ''}$${Number(t.pnl).toFixed(2)}</td>
                    <td class="py-3 px-4 text-center whitespace-nowrap">
                        <button onclick="deleteTrade('${t.id}')" class="text-gray-500 hover:text-neonRed p-1 transition-all" title="Delete Trade">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderMetrics() {
            let totalPnl = 0;
            let wins = 0;
            let losses = 0;
            let grossWin = 0;
            let grossLoss = 0;

            trades.forEach(t => {
                const p = Number(t.pnl);
                totalPnl += p;
                if(p > 0) {
                    wins++;
                    grossWin += p;
                } else if(p < 0) {
                    losses++;
                    grossLoss += Math.abs(p);
                }
            });

            const total = trades.length;
            const winRate = total > 0 ? ((wins / total) * 100).toFixed(1) : '0.0';
            const profitFactor = grossLoss > 0 ? (grossWin / grossLoss).toFixed(2) : (grossWin > 0 ? 'Infinite' : '0.00');

            // Render Total P&L
            const pnlEl = document.getElementById('metric-pnl');
            pnlEl.textContent = (totalPnl >= 0 ? '+' : '') + '$' + totalPnl.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            pnlEl.className = "text-2xl font-bold tracking-tight mt-2 " + (totalPnl >= 0 ? 'text-neonGreen' : 'text-neonRed');

            // Render Win Rate
            document.getElementById('metric-winrate').textContent = winRate + '%';

            // Render Total Trades
            document.getElementById('metric-total').textContent = total;

            // Render Profit Factor
            document.getElementById('metric-pf').textContent = profitFactor;
        }

        function exportCSV() {
            if(trades.length === 0) {
                alert('No trades available to export.');
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Date,Symbol,Type,Strategy,P&L,Notes\n";
            trades.forEach(t => {
                const row = [t.date, t.symbol, t.type, t.strategy, t.pnl, `"${(t.notes || '').replace(/"/g, '""')}"`];
                csvContent += row.join(",") + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `trading_journal_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();
        }
    </script>
</body>
</html>
